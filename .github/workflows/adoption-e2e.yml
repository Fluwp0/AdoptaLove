name: Adoption regression

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  adoption-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Build Sites package
        run: npm run build

      - name: Start application
        run: |
          nohup npm start > /tmp/adoptalove-next.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/adoptalove-next.log
          exit 1

      - name: Verify adoption flow in Chromium and WebKit
        run: node scripts/adoption-flow-smoke.mjs

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/adoptalove-next.log || true
