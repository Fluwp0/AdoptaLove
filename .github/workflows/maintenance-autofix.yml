name: Maintenance dependency autofix

on:
  push:
    branches:
      - codex/maintenance-2026-08-27

permissions:
  contents: write

jobs:
  update-lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          ref: codex/maintenance-2026-08-27

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh root lockfile security fixes
        run: |
          npm ci
          npm audit fix --package-lock-only --audit-level=high

      - name: Refresh frontend lockfile security fixes
        run: |
          npm ci --prefix frontend
          npm audit fix --package-lock-only --audit-level=high --prefix frontend

      - name: Refresh backend lockfile security fixes
        run: |
          npm ci --prefix backend
          npm audit fix --package-lock-only --audit-level=high --prefix backend

      - name: Commit refreshed lockfiles
        run: |
          if git diff --quiet -- package-lock.json frontend/package-lock.json backend/package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json frontend/package-lock.json backend/package-lock.json
          git commit -m "chore: refresh vulnerable dependencies"
          git push origin HEAD:codex/maintenance-2026-08-27
